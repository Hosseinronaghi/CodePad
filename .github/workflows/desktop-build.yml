name: Desktop Builds (Windows and macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: :composeApp:packageMsi
            artifact: CodePad-Windows-MSI
            output: composeApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            task: :composeApp:packageDmg
            artifact: CodePad-macOS-DMG
            output: composeApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and package desktop
        shell: bash
        run: gradle --no-daemon --stacktrace ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
