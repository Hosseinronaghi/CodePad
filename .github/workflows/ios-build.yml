name: iOS Kotlin Framework

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  ios-framework:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check Xcode
        run: xcodebuild -version
      - name: Compile iOS simulator Kotlin source
        run: gradle --no-daemon --stacktrace :composeApp:compileKotlinIosSimulatorArm64
