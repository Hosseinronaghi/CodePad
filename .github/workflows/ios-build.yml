name: iOS Kotlin Framework

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  ios-framework:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check Xcode
        run: xcodebuild -version
      - name: Link iOS simulator Kotlin framework
        run: gradle --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate
      - name: Compile simulator iOS app
        run: xcodebuild -project iosApp/CodePad.xcodeproj -scheme CodePad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 build
      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodePad-iOS-simulator-app
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/CodePad.app/**
          if-no-files-found: warn
